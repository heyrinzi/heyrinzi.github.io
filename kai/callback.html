<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Kai · Ritorno dalla banca</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0E0C0B; color: #F2ECE6; font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 48px 20px; }
  h1 { font-size: 28px; margin: 0 0 8px; }
  h1 span { color: #FF8A4C; }
  p { color: #D8D0C8; }
  .btn { display: inline-block; background: #FF8A4C; color: #0E0C0B; border: 0; border-radius: 999px; padding: 12px 20px; font: 600 16px system-ui, sans-serif; text-decoration: none; }
</style>
</head>
<body>
<main>
<h1><span>Kai</span> · ritorno dalla banca</h1>
<p id="msg">Puoi chiudere questa pagina.</p>
<p id="back" hidden><a class="btn" id="open" href="#">Torna a Kai</a></p>
<script>
  // Il testo mostrato dipende solo dal tipo di esito: i valori della query non finiscono mai nella pagina.
  function outcome(search) {
    const q = new URLSearchParams(search);
    // Un `error`, anche vuoto, vince sul `code`: come parseRedirect nell'app.
    const hasError = [...q.keys()].some(key => key.toLowerCase() === 'error');
    const text = hasError ? 'Accesso annullato.' : q.get('code') ? 'Collegamento riuscito.' : null;
    const href = text && 'intent://heyrinzi.github.io/kai/callback?' + search.replace(/^\?/, '') + '#Intent;scheme=https;package=com.kaizen.kai;end';
    return { text, href };
  }
  const r = outcome(location.search);
  if (r.text) {
    document.getElementById('msg').textContent = r.text;
    document.getElementById('open').href = r.href;
    document.getElementById('back').hidden = false;
  }
</script>
</main>
</body>
</html>
